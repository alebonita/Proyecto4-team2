name: CI

# Corre en cada PR (contra cualquier rama base, para que también se validen los PR
# "hermano" que apuntan a la rama de otro ticket) y en cada push a main.
#
# Ningún paso usa `continue-on-error` ni `|| true`: si una validación falla, el job
# falla y el PR queda en rojo. `CI OK` resume todos los jobs y es el único check que
# conviene marcar como obligatorio en la protección de la rama (ver CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (Ruff y pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Misma versión que app/Dockerfile.
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Instalar dependencias (falla si uv.lock está desactualizado)
        # --no-build: solo wheels ya publicadas, sin ejecutar scripts de compilación de
        # terceros (mismo criterio que app/Dockerfile).
        run: uv sync --locked --no-build
      - name: Ruff (lint)
        run: uv run --locked --no-build ruff check .
      - name: Ruff (formato)
        run: uv run --locked --no-build ruff format --check .
      - name: Tests
        run: uv run --locked --no-build pytest -q
      - name: Mutation test (quality gate)
        run: uv run --locked --no-build python ../.github/scripts/run_gate_mutation.py

  backend:
    name: Backend (Biome, tsc, tests y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Misma versión que backend/Dockerfile.
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        # --ignore-scripts: no ejecutar scripts de instalación de terceros; los binarios
        # nativos (esbuild, Biome, sharp) llegan como paquetes opcionales, sin scripts.
        run: npm ci --ignore-scripts
      - name: Lint (Biome)
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (Biome, tsc, tests y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Misma versión que frontend/Dockerfile.
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        # --ignore-scripts: no ejecutar scripts de instalación de terceros; los binarios
        # nativos (esbuild, Biome, sharp) llegan como paquetes opcionales, sin scripts.
        run: npm ci --ignore-scripts
      - name: Lint (Biome)
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: docker-compose.yml válido
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar la configuración expandida
        # Valores de mentira: `docker compose config` solo comprueba que el YAML y las
        # variables obligatorias (`${VAR:?...}`) estén bien formados, no las usa.
        env:
          MARIADB_ROOT_PASSWORD: ci
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci
        run: docker compose config --quiet

  mlflow:
    name: MLflow persistente (OPS-03)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Credenciales efímeras del runner: solo existen durante este job.
      MARIADB_ROOT_PASSWORD: ci-mlflow-${{ github.run_id }}
      MINIO_ROOT_USER: ci-mlflow
      MINIO_ROOT_PASSWORD: ci-mlflow-${{ github.run_id }}
      MLFLOW_TRACKING_URI: http://localhost:5000
      MLFLOW_INTEGRATION: "1"
      # Falla en minutos, no en horas, si el servidor deja de responder.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Misma versión que app/Dockerfile.
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Instalar dependencias del cliente
        working-directory: app
        run: uv sync --locked --no-build
      - name: Levantar MariaDB, MinIO y MLflow
        run: docker compose up -d --build --wait mariadb minio mlflow
      - name: Otro contenedor alcanza http://mlflow:5000 (como el worker)
        run: >-
          docker compose run --rm --no-deps --entrypoint python mlflow -c
          "from mlflow.tracking import MlflowClient;
          print(MlflowClient('http://mlflow:5000').search_experiments(max_results=1))"
      - name: Un run sobrevive a recrear el stack (Agent Test del issue #8)
        working-directory: app
        run: uv run --locked --no-build pytest -v tests/test_mlflow_persistence.py
      - name: Experiments lee runs reales de MLflow (APP-04, Agent Test del issue #16)
        working-directory: app
        run: uv run --locked --no-build pytest -v tests/test_experiments_mlflow_integration.py
      - name: Logs del servidor MLflow
        if: failure()
        run: docker compose logs mlflow mariadb minio
      - name: Apagar y borrar los datos efímeros del runner
        if: always()
        run: docker compose down -v

  training-queue:
    name: Cola de entrenamiento en MariaDB (APP-03)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Credenciales efímeras del runner: solo existen durante este job.
      MARIADB_ROOT_PASSWORD: ci-queue-${{ github.run_id }}
      MINIO_ROOT_USER: ci-queue
      MINIO_ROOT_PASSWORD: ci-queue-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Misma versión que app/Dockerfile.
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Instalar dependencias
        working-directory: app
        run: uv sync --locked --no-build
      - name: Levantar MariaDB (la misma imagen del stack)
        run: docker compose up -d --wait mariadb
      - name: Cola de jobs sobre MariaDB, incluido FOR UPDATE SKIP LOCKED
        working-directory: app
        env:
          TRAINING_QUEUE_DATABASE_URL: mysql+pymysql://root:${{ env.MARIADB_ROOT_PASSWORD }}@127.0.0.1:3306/image_repo
        run: uv run --locked --no-build pytest -v tests/test_training_queue.py
      - name: Apagar y borrar los datos efímeros del runner
        if: always()
        run: docker compose down -v

  quality-gate:
    name: Quality gate (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Instalar dependencias
        run: uv sync --locked --no-build
      - name: Ejecutar compuerta sobre fixture COCO
        run: uv run --locked --no-build pytest -q tests/test_quality_gate_ci.py

  quality-gate-prod:
    name: Quality gate (PROD dataset when OIDC is configured)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the externally provisioned role
        id: role
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::warning title=PROD quality gate pending::AWS_ROLE_ARN is not configured; the PROD dataset gate is skipped until the externally provisioned OIDC role is available."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assume the AWS role using GitHub OIDC
        if: steps.role.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-duration-seconds: 900
          role-session-name: github-quality-gate-${{ github.run_id }}
          mask-aws-account-id: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.role.outputs.configured == 'true'
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Instalar DVC con soporte S3
        if: steps.role.outputs.configured == 'true'
        run: |
          uv venv .venv-dvc-ci --python 3.12
          uv pip install --no-build --python .venv-dvc-ci/bin/python 'dvc[s3]==3.67.1'
      - name: Recuperar únicamente los datos versionados de PROD
        if: steps.role.outputs.configured == 'true'
        run: .venv-dvc-ci/bin/dvc pull -r p2-origen data/raw/images.dvc data/raw/annotations.dvc
      - name: Instalar dependencias del pipeline
        if: steps.role.outputs.configured == 'true'
        working-directory: app
        run: uv sync --locked --no-build
      - name: Generar el reporte de calidad de PROD
        if: steps.role.outputs.configured == 'true'
        working-directory: app
        run: uv run --locked --no-build python dvc_quality_report_stage.py
      - name: Ejecutar la compuerta sobre PROD
        if: steps.role.outputs.configured == 'true'
        working-directory: app
        run: uv run --locked --no-build python dvc_gate_stage.py

      - name: Reproducir crops de ML-01 sobre PROD
        if: steps.role.outputs.configured == 'true'
        run: .venv-dvc-ci/bin/dvc repro crops manifest

      - name: Guardar evidencia reproducible de crops
        if: steps.role.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ml-01-crops-evidence
          path: |
            dvc.lock
            reports/crops.json
          if-no-files-found: error


  training-worker-e2e:
    name: Training worker E2E (OPS-04)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MARIADB_ROOT_PASSWORD: ci-worker-${{ github.run_id }}
      MINIO_ROOT_USER: ci-worker
      MINIO_ROOT_PASSWORD: ci-worker-${{ github.run_id }}
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      TRAINING_QUEUE_DATABASE_URL: mysql+pymysql://root:ci-worker-${{ github.run_id }}@127.0.0.1:3306/image_repo
      TRAINING_WORKER_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exigir acceso al dataset PROD
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN es obligatorio para el E2E real de OPS-04."
            exit 1
          fi

      - name: Assume the AWS role using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-duration-seconds: 1800
          role-session-name: github-training-worker-${{ github.run_id }}
          mask-aws-account-id: true

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Instalar DVC con soporte S3
        run: |
          uv venv .venv-dvc-e2e --python 3.12
          uv pip install --no-build --python .venv-dvc-e2e/bin/python 'dvc[s3]==3.67.1'

      - name: Recuperar datos versionados de PROD
        run: .venv-dvc-e2e/bin/dvc pull -r p2-origen data/raw/images.dvc data/raw/annotations.dvc

      - name: Instalar dependencias Python
        working-directory: app
        run: uv sync --locked --no-build

      - name: Preparar Quality Gate
        working-directory: app
        run: |
          uv run --locked --no-build python dvc_quality_report_stage.py
          uv run --locked --no-build python dvc_gate_stage.py

      - name: Reproducir crops y manifest del release
        run: .venv-dvc-e2e/bin/dvc repro crops manifest

      - name: Levantar stack completo de Proyecto 3
        run: docker compose up -d --build

      - name: Esperar MLflow y portal
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null \
              && curl -fsS http://127.0.0.1:8080/api/ml/health >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          echo "::error::El stack de OPS-05 no quedo listo."
          docker compose ps
          exit 1

      - name: Cola -> worker -> MLflow -> checkpoint
        working-directory: app
        run: uv run --locked --no-build pytest -v tests/test_training_worker_e2e.py

      - name: Smoke training desde el portal (OPS-05)
        working-directory: app
        env:
          OPS05_API_BASE: http://127.0.0.1:8080/api/ml
          OPS05_TIMEOUT_SECONDS: "900"
        run: uv run --locked --no-build python -m training.smoke

      - name: P3 trazable end-to-end (OPS-09)
        working-directory: app
        env:
          OPS09_E2E: "1"
          OPS09_S3_ENDPOINT: http://127.0.0.1:9000
          OPS09_TRACE_OUTPUT: ${{ github.workspace }}/reports/evidence/ops09-traceability.json
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
          AWS_SESSION_TOKEN: ""
          AWS_SECURITY_TOKEN: ""
          AWS_DEFAULT_REGION: us-east-1
        run: uv run --locked --no-build pytest -v tests/test_p3_e2e_traceability.py

      - name: Guardar evidencia de trazabilidad OPS-09
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ops-09-e2e-traceability
          path: reports/evidence/ops09-traceability.json
          if-no-files-found: error

      - name: Verificar descarga real de pesos ImageNet
        run: |
          docker compose exec -T training-worker python -c "from pathlib import Path; p=Path('/home/appuser/.cache/torch/hub/checkpoints/resnet18-f37072fd.pth'); assert p.is_file() and p.stat().st_size > 0, p; print(f'Pesos pretrained descargados: {p} ({p.stat().st_size} bytes)')"

      - name: Logs del stack
        if: failure()
        run: docker compose logs backend frontend ml-api training-worker mlflow mariadb minio app

      - name: Apagar y borrar datos efimeros
        if: always()
        run: docker compose down -v
  secrets:
    name: Secret scan (HEAD + Git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Rechazar datasets, checkpoints y artefactos locales trackeados
        shell: bash
        run: |
          forbidden="$(
            git ls-files |
            grep -E '(^|/)\.env(\..+)?$|(^|/)\.dvc/config\.local$|(^|/)(mlruns|mlartifacts)/|(^|/)data/(crops|models)/|(^|/)data/raw/(images|annotations)/|\.(pt|pth|ckpt)$' |
            grep -Ev '(^|/)\.env(\..+)?\.example$' \
            || true
          )"

          if [ -n "$forbidden" ]; then
            echo "::error::Git contiene archivos que deben permanecer fuera del repositorio:"
            echo "$forbidden"
            exit 1
          fi

          echo "No hay datasets, checkpoints, .env ni artefactos MLflow trackeados."

      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Revisar HEAD por secretos
        run: gitleaks dir . --redact --no-banner

      - name: Revisar historial Git por secretos
        run: gitleaks git . --redact --no-banner

  ci-ok:
    name: CI OK
    # `always()`: si un job falla, este también debe correr y fallar. Sin esto, un job
    # fallido dejaría a `CI OK` en "skipped", y GitHub lo trata como aprobado.
    if: always()
    needs: [python, backend, frontend, compose, mlflow, training-queue, quality-gate, quality-gate-prod, training-worker-e2e, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Todos los jobs deben haber pasado
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::Un job de CI terminó en '$result'."
              exit 1
            fi
          done
