# Despliegue en AWS: un solo servidor EC2 (ver "Despliegue en AWS" en el README).
# Se usa encima de docker-compose.yml, sin modificarlo:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#
# Solo nginx (servicio `frontend`) queda publicado, en el puerto 80. El resto de los
# puertos se publica únicamente en 127.0.0.1 del servidor: desde fuera se llega a
# ellos por túnel SSH, nunca por internet. `!override` reemplaza la lista de puertos
# de docker-compose.yml en vez de sumarla (requiere Docker Compose 2.24.4 o más nuevo).
#
# `restart: unless-stopped` hace que el portal vuelva solo después de reiniciar el
# servidor. `app` conserva su `on-failure:5`: sin los datos del release la compuerta
# falla, y así no queda reiniciándose para siempre.
#
# AWS-3: la instancia tiene el rol `portal-proyecto4-ec2` (lee `models/` y escribe en
# `edge-captures/` del bucket del equipo). docker-compose.yml desactiva el metadata
# service en `ml-api` porque fuera de EC2 no existe; aquí se reactiva para que boto3
# tome las credenciales del rol y Models confirme la publicación en S3. Requiere
# `HttpPutResponseHopLimit=2` en la instancia (un salto más por la red de Docker).
# `backend` no define esa variable, así que también usa el rol: AWS-1 guarda ahí las
# fotos de Capturas Edge (POST /edge-captures). Ver "Datos del proyecto" en el README.
#
# EDGE_CAPTURES_ALLOWED_ORIGINS queda en `*` (cualquier origen) mientras no se conozca
# la URL de la página del celular. Para restringirlo, ponla en el .env del servidor,
# por ejemplo `EDGE_CAPTURES_ALLOWED_ORIGINS=https://celular.example.com`.

services:
  frontend:
    ports: !override
      - "80:80"
    restart: unless-stopped

  backend:
    ports: !override
      - "127.0.0.1:3100:3100"
    environment:
      EDGE_CAPTURES_BUCKET: mlops-p4-equipo-452857281704
      EDGE_CAPTURES_REGION: us-east-2
      EDGE_CAPTURES_ALLOWED_ORIGINS: ${EDGE_CAPTURES_ALLOWED_ORIGINS:-*}
    restart: unless-stopped

  mariadb:
    ports: !override
      - "127.0.0.1:3306:3306"
    restart: unless-stopped

  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  mlflow:
    restart: unless-stopped

  ml-api:
    environment:
      AWS_EC2_METADATA_DISABLED: "false"
    restart: unless-stopped

  copilot:
    restart: unless-stopped

  training-worker:
    restart: unless-stopped
