# Variables que exige `storage.settings.Settings` (las usan `app` y `copilot`).
x-pipeline-env: &pipeline-env
  DATABASE_URL: "mysql+pymysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/image_repo"
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
  MINIO_BUCKET: image-annotations
  DATASET_DIR: /app/data/raw
  REPORTS_DIR: /app/reports
  # OPS-03: contrato con el worker (OPS-04) y el entrenamiento (ML-04). Los
  # artefactos se suben a través del servidor, sin credenciales de MinIO.
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # MLflow 3 descargaría directo de MinIO con URLs prefirmadas; se fuerza el paso
  # por el servidor (ver app/tracking/client.py).
  MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
  MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: image_repo
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      # Por TCP y no por socket: al inicializar, la imagen arranca un servidor temporal
      # solo por socket y luego lo reinicia; un ping por socket daba "sano" antes de
      # tiempo y la primera consulta de otro servicio caía en ese reinicio.
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Issue #36: quay.io/minio/minio y minio/minio ya no se pueden descargar sin
    # autenticación. Esta es la build pública de Chainguard (misma CLI). Solo
    # publica `latest`. Lee los volúmenes `minio_data` creados con la imagen
    # anterior; respaldo opcional en "Cambio de imagen de MinIO (issue #36)" del README.
    image: cgr.dev/chainguard/minio:latest
    # Corre como 65532 por defecto: no podría escribir ni un volumen nuevo en /data
    # ni los existentes, que creó como root la imagen anterior.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # OPS-03: MLflow Tracking Server persistente. Runs/métricas en la base `mlflow`
  # de MariaDB y artefactos en el bucket `mlflow` de MinIO: sobreviven a
  # `docker compose down` (sin -v). Ver mlflow-server/README.md.
  mlflow:
    build: ./mlflow-server
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MLFLOW_BACKEND_STORE_URI: "mysql+pymysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/mlflow"
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      # MLflow 3 rechaza Host headers que no sean localhost/IP privada; `mlflow`
      # es como lo llaman los demás contenedores.
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      # Solo loopback: la UI no tiene autenticación.
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: on-failure:5

  backend:
    build: ./backend
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: "mysql://root:${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}@mariadb:3306/image_repo"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      DB_NAME: image_repo
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: image-annotations
      MAX_UPLOAD_SIZE_BYTES: 10485760
      PIPELINE_CONFIG_ROOT: /pipeline
      # APP-09: la cola de anotación (APP-08) verifica modelo, checkpoint y recorte
      # contra reports/models/registry.json y reports/crops.json.
      REPORTS_DIR: /reports
      # AWS-2: clave del dispositivo edge (laptop) para POST /edge-captures, desde .env.
      # Vacía, ese endpoint responde 503 (no queda abierto). Ver .env.example.
      EDGE_DEVICE_KEY: ${EDGE_DEVICE_KEY:-}
    volumes:
      - ./app/policies:/pipeline/policies
      - ./app/splits:/pipeline/splits
      - ./reports:/reports:ro
    ports:
      - "3100:3100"
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_started
      copilot:
        condition: service_started
      # nginx no recibe tráfico para /api/ml/ hasta que ml-api responde (evita 502).
      ml-api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # P2-22/23/24: el gate (servicio `app`) escribe reportes acá; nginx
      # los sirve como estático en /reports/*.json, sin backend HTTP nuevo.
      - ./reports:/usr/share/nginx/html/reports:ro

  app:
    build: ./app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment: *pipeline-env
    volumes:
      # Dataset real (anotaciones + imágenes), de solo lectura: el gate no
      # escribe ahí, solo lee. El pipeline Python nunca gestionó data/raw/
      # como parte de su propia imagen (ver app/Dockerfile).
      - ./data/raw:/app/data/raw:ro
      - ./reports:/app/reports
      - ./app/policies:/app/policies:ro
      - ./app/splits:/app/splits:ro
    restart: on-failure:5

  # APP-03: API de jobs de entrenamiento (/api/ml/ en nginx). Solo encola jobs en
  # MariaDB; el entrenamiento lo corre el worker de OPS-04 en otro proceso. Lee los
  # archivos del release (gate, procedencia, manifest) para validar cada POST.
  ml-api:
    build: ./app
    command: ["python", "-m", "training.server"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      <<: *pipeline-env
      ML_API_HOST: 0.0.0.0
      # APP-04: /api/ml/runs lee MLflow. Si no responde, mejor un 503 en segundos que
      # los minutos de reintentos por defecto del cliente.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      # APP-05: recortes de ML-01 (`dvc pull`) para los ejemplos de Evaluation. Sin
      # ellos la pantalla funciona igual y muestra cada ejemplo sin imagen.
      CROPS_DIR: /app/data/crops
      # APP-06/09: Models confirma en S3 (head-object + ChecksumSHA256) cada objeto que
      # OPS-07 publicó. Credenciales opcionales, desde el entorno de quien levanta el
      # stack (nunca en el repo ni en .env), p. ej.:
      #   eval "$(aws configure export-credentials --profile mlops-p2 --format env)"
      #   docker compose up -d ml-api
      # Vacías (por defecto), boto3 las ignora y Models muestra "No verificable".
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Fuera de EC2 no hay metadata service: sin esto, cada consulta sin credenciales
      # esperaría su timeout antes de responder "No verificable".
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-true}
    volumes:
      - ./reports:/app/reports:ro
      - ./data/crops:/app/data/crops:ro
      # APP-07: paquetes del modelo de OPS-06 (`dvc pull data/models.dvc`), listados en
      # reports/models/registry.json. Sin ellos, Inference responde model_package_missing.
      - ./data/models:/app/data/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: on-failure:5

  # OPS-04: worker asincrono persistente de entrenamiento.
  # Consume jobs de MariaDB, ejecuta run_training() y registra resultados en MLflow.
  training-worker:
    build: ./app
    command: ["python", "-m", "training.worker"]
    depends_on:
      mariadb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *pipeline-env
      TRAINING_WORKER_ID: training-worker-1
      GIT_COMMIT: ${GIT_COMMIT:?Define GIT_COMMIT con el SHA actual}
    volumes:
      - ./data/crops:/data/crops:ro
      - ./reports:/reports:ro
    restart: on-failure:5

  # P2-52: agente del Copilot (LLM + herramientas MCP de solo lectura). Misma
  # imagen que `app`, otro comando. No se publica ningún puerto: solo nginx
  # (servicio `frontend`) lo alcanza, en /copilot-api/. Sin ANTHROPIC_API_KEY
  # arranca igual y el chat responde 503 explicando qué falta.
  copilot:
    build: ./app
    command: ["python", "-m", "copilot.server"]
    environment:
      <<: *pipeline-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-opus-5}
      COPILOT_HOST: 0.0.0.0
    volumes:
      # Solo lectura: el Copilot consulta el dataset y los reportes, nunca escribe.
      - ./data/raw:/app/data/raw:ro
      - ./reports:/app/reports:ro
    restart: on-failure:5

volumes:
  mariadb_data:
  minio_data:
