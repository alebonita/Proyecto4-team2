# Plantilla de configuracion del dispositivo edge, sin secretos. Copiala a config.yaml
# y ajusta device_id y, si cambia el servidor, upload.api_url. Las rutas relativas se
# resuelven desde la carpeta de este archivo.

# Indice de la camara: 0 es /dev/video0. Si hay varias, prueba 1, 2...
camera_index: 0

# Carpeta donde se guardan las fotos JPEG (se crea si no existe).
output_dir: captures

# Calidad JPEG, de 1 a 100.
jpeg_quality: 95

# auto: ventana si hay pantalla, terminal si no. true: pide ventana. false: solo terminal.
preview: auto

# Cuadros que se descartan al abrir la camara (la exposicion tarda en ajustarse).
warmup_frames: 5

# Resolucion opcional. Defínelas las dos o deja las dos vacías.
width:
height:

# Identidad del dispositivo: se registra en cada evento y se envia a AWS (EDG-3/EDG-4).
device_id: edge-<equipo>-01

# Historial local de capturas (SQLite). Se conserva al cerrar el programa.
events_db: events.db

# Captura por intervalo (EDG-6): con la tecla i se activa o se detiene una captura cada
# tantos segundos. Vacio: la tecla i no hace nada.
capture_interval_s: 10

# Archivo de registro local: arranque, capturas, envios y errores. Rota solo (1 MB x 4).
log_file: logs/edge.log

# Recorte fijo que se clasifica: cuadrado centrado con esta fraccion del lado corto
# del cuadro. Se dibuja en la vista previa; el objeto se presenta dentro del recuadro.
crop_fraction: 0.8

# Modelo ONNX (EDG-2). El archivo no esta en git: ver "Modelo" en el README.
model:
  path: models/dog-cat-resnet18-1.0.0-int8.onnx
  version: dog-cat-resnet18-1.0.0-int8
  # Si el archivo no tiene este SHA-256, el programa no arranca. Vacio: no se comprueba.
  sha256: 9c28368acaf04e184e0712946c08e319d2b7ee2dc83d3f8ef0367d0b9c8935cd
  # Orden de salida del modelo: dog es el indice 0 (evidencias/mod-01/README.md).
  classes: [dog, cat]

# Preprocesamiento: el mismo del modelo original (evidencias/mod-01/README.md).
preprocess:
  input_size: 128            # 128 x 128, sin conservar proporcion
  channel_order: RGB         # OpenCV entrega BGR y se convierte a RGB
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Envio a AWS (EDG-4): endpoint de Capturas Edge del portal (AWS-1/AWS-2).
# La clave del dispositivo NO va aqui: sale de la variable de entorno key_env o del
# archivo key_file, con una linea EDGE_DEVICE_KEY=<clave> (ver README).
# EDGE_API_URL y EDGE_KEY_HEADER, si estan definidas, pisan api_url y key_header.
upload:
  api_url: http://18.216.36.30/api/edge-captures
  key_header: X-Device-Key
  key_env: EDGE_DEVICE_KEY
  key_file: ~/.config/edge/device.env
  timeout_s: 10
  auto_send: true                # false: no se envia al capturar; se envia con retry.py
